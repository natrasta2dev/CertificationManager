<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — CertificationManager</title>
    <link rel="icon" href="/favicon.ico" type="image/svg+xml">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-page">
        <div class="login-hero">
            <h1><i class="fas fa-shield-halved"></i> CertificationManager</h1>
            <p>Gestion centralisée de vos certificats X.509 — génération, renouvellement, conformité et audit PKI.</p>
            <ul class="login-hero-features">
                <li><i class="fas fa-check-circle"></i> Inventaire & cycle de vie TLS</li>
                <li><i class="fas fa-check-circle"></i> Alertes d'expiration en temps réel</li>
                <li><i class="fas fa-check-circle"></i> Conformité Mozilla / NIST</li>
            </ul>
        </div>
        <div class="login-panel">
            <div class="login-card">
                <h2>Connexion</h2>
                <p class="subtitle">Accédez à votre espace d'administration PKI</p>
                <form id="login-form" class="form">
                    <div class="form-group">
                        <label for="username">Nom d'utilisateur</label>
                        <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">
                        <i class="fas fa-sign-in-alt"></i> Se connecter
                    </button>
                    <p class="login-error" id="error-msg" role="alert"></p>
                </form>
            </div>
        </div>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error-msg');
            errorEl.style.display = 'none';

            const formData = new URLSearchParams();
            formData.append('username', document.getElementById('username').value);
            formData.append('password', document.getElementById('password').value);

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData,
                });
                const result = await response.json();

                if (response.ok && result.success) {
                    localStorage.setItem('auth_token', result.data.access_token);
                    localStorage.setItem('refresh_token', result.data.refresh_token);
                    localStorage.setItem('csrf_token', result.data.csrf_token);
                    localStorage.setItem('auth_user', JSON.stringify(result.data.user));
                    window.location.href = '/';
                } else {
                    errorEl.textContent = result.detail || 'Identifiants incorrects';
                    errorEl.style.display = 'block';
                }
            } catch {
                errorEl.textContent = 'Erreur de connexion au serveur';
                errorEl.style.display = 'block';
            }
        });
    </script>
</body>
</html>
